[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hexwatershed_utility"
version = "0.1.0"
description = "A collection of tools for HexWatershed pre and post processing"
readme = "README.md"
authors = [
    {name = "Chang Liao", email = "changliao.climate@gmail.com"}
]
license = {text = "BSD-3-Clause"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]
keywords = ["mesh", "GIS", "hydrology", "watershed", "HexWatershed", "MPAS", "E3SM", "MOSART", "ELM"]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "netCDF4>=1.5.0",
    "shapely>=1.8.0",
    "requests",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0",
    "cartopy>=0.20.0",
    "pyearthviz>=0.1.1",
]
viz3d = [
    "pyearthviz3d>=0.1.1",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=1.0",
]
all = [
    "hexwatershed_utility[viz,viz3d,dev,docs]",
]

[project.urls]
Homepage = "https://github.com/changliao1025/hexwatershed_utility"
Documentation = "https://hexwatershed-utility.readthedocs.io"
Repository = "https://github.com/changliao1025/hexwatershed_utility"
Issues = "https://github.com/changliao1025/hexwatershed_utility/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["hexwatershed_utility*"]
exclude = ["tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
hexwatershed_utility = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["truthy-function", "var-annotated", "name-defined", "attr-defined", "misc"]
